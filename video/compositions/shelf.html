  <script>
    const tl = gsap.timeline({ paused: true });

    // Same stable rotation hash as components/stamp-badge.tsx.
    function stampRotation(seed) {
      let h = 2166136261;
      for (let i = 0; i < seed.length; i++) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return -3 + ((h >>> 0) % 11) * 0.5;
    }
    const rot = {};
    document.querySelectorAll(".stamp").forEach((el) => {
      rot[el.id] = stampRotation(el.dataset.seed);
      gsap.set(el, { rotation: rot[el.id], autoAlpha: 0 });
    });
    gsap.set("#d-new", { y: 30, opacity: 0 });
    gsap.set(".s-row, #s-head", { opacity: 0 });
    gsap.set("#s-world", { scale: 1, x: 0, y: 0 });

    // The white label opens into the card.
    tl.fromTo(
      "#s-open",
      { clipPath: "inset(0px 0px 0px 0px round 0px)" },
      { clipPath: "inset(130px 280px 200px 280px round 10px)", duration: 0.7, ease: "power3.inOut" },
      0,
    );
    tl.set("#s-open", { opacity: 0 }, 0.76);
    tl.fromTo("#s-shadow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.6);
    tl.fromTo("#s-head", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 0.7);
    tl.fromTo(
      ".s-row",
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 },
      0.8,
    );
    gsap.set("#s-field", { x: 0 });
    tl.fromTo("#s-field", { x: 0 }, { x: -24, duration: 17.5, ease: "none" }, 0);

    // Stamps thunk in, row by row, as on the landing page.
    function thunk(id, at) {
      tl.fromTo(
        id,
        { autoAlpha: 0, scale: 1.6, rotation: rot[id.slice(1)] + 8 },
        { autoAlpha: 1, scale: 1, rotation: rot[id.slice(1)], duration: 0.28, ease: "back.out(2.2)" },
        at,
      );
      tl.fromTo("#s-card", { x: 0 }, { keyframes: { x: [2, -2, 1, 0] }, duration: 0.2, ease: "none" }, at + 0.15);
    }
    ["#st-0", "#st-1", "#st-2", "#st-3", "#st-4"].forEach((id, i) => thunk(id, 1.25 + i * 0.14));

    // Captions: whole-line blur in, blur out.
    function cap(id, a, b) {
      tl.fromTo(id, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, a);
      tl.to(id, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, b);
    }
    cap("#s-cap1-in", 2.85, 5.2);
    cap("#s-cap2-in", 6.05, 9.2);
    cap("#s-cap3-in", 9.65, 12.7);

    // Camera: push to the Amoxicillin row (row centre screen y 480), x = 960 - 960 s.
    const S = 1.35;
    const push = { scale: S, x: 960 - 960 * S, y: 480 - 304 * S, duration: 0.5, ease: "power2.inOut" };
    tl.to("#s-world", push, 5.4);

    // The shelf recedes behind the cards (stat pair, then digest) and returns at 12.8.
    tl.to("#s-world", { opacity: 0.3, filter: "blur(6px)", duration: 0.4, ease: "power2.inOut" }, 5.9);

    // Book vs. counted: the pair rises out of the row.
    tl.fromTo(
      "#s-stat-in",
      { opacity: 0, y: 40, filter: "blur(10px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
      5.95,
    );
    tl.to("#s-stat-in", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 9.15);

    // Weekly digest: the shelf recedes, the summary arrives on top.
    tl.to("#s-world", { scale: 1, x: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, 9.4);
    tl.fromTo(
      "#s-mail-in",
      { opacity: 0, y: 40, filter: "blur(10px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
      9.6,
    );
    tl.to("#s-mail-in", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 12.75);
    tl.to("#s-world", { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 12.8);

    // Payoff: push in, the count ticks, the lot is re-stamped.
    tl.to("#s-world", push, 13.4);
    tl.to("#d-old", { y: -30, opacity: 0, duration: 0.2, ease: "power2.in" }, 14.5);
    tl.to("#d-new", { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 14.5);

      14.65,

    tl.fromTo("#s-card", { x: 0 }, { keyframes: { x: [3, -3, 1.5, 0] }, duration: 0.24, ease: "none" }, 14.8);
    tl.to("#s-world", { scale: 1, x: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, 16.3);
